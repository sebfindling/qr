<style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fa;color:#202733;font:14px system-ui,sans-serif}.container{width:min(100%,930px);display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:30px;padding:30px;background:white;border-radius:18px;box-shadow:0 8px 32px #152b4412}h1{font-size:25px;margin:0 0 8px}h2{font-size:13px;color:#687385;margin:18px 0 8px}.types{display:flex;flex-wrap:wrap;gap:7px}.type-btn{padding:7px 11px;border:1px solid #dce2eb;border-radius:20px;background:white;color:#303d50;cursor:pointer;font:inherit;font-size:12px}.type-btn.active{background:#276af0;color:white;border-color:#276af0}.fields{display:grid;gap:11px;margin-top:20px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:600;color:#4c586b}.field input,.field textarea,.field select{width:100%;border:1.5px solid #dce2eb;border-radius:8px;padding:10px;font:inherit;min-width:0}.field textarea{min-height:78px;resize:vertical}.field.check{display:flex;align-items:center;gap:8px}.field.check input{width:auto}.qr-panel{display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:24px;align-self:start}.qr-box{width:240px;min-height:240px;border:1px solid #e5e9ef;border-radius:12px;display:grid;place-items:center;padding:10px;background:white;color:#8c96a6;text-align:center;font-size:12px;overflow:hidden}.qr-box img{display:block;width:100%;height:auto;image-rendering:pixelated}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.action{padding:9px 13px;border:0;border-radius:7px;background:#17814c;color:white;cursor:pointer;font:inherit;font-size:12px}.action.secondary{background:#eaf1ff;color:#215ac1}.action:disabled{opacity:.45}.hint{font-size:12px;color:#778292;text-align:center;line-height:1.5}.error{font-size:12px;color:#c12f39;text-align:center}.settings{width:100%;display:grid;gap:6px}.settings label{font-size:12px;color:#687385}.settings select{width:100%;padding:7px;border:1px solid #dce2eb;border-radius:7px;background:white}.hidden{display:none!important}.qr-box.drag{outline:2px dashed #276af0}@media(max-width:690px){body{padding:12px;display:block}.container{grid-template-columns:1fr;padding:20px;gap:22px}.qr-panel{position:static;grid-row:1}.qr-box{width:200px;min-height:200px}}</style></head>
<body><main class="container"><section><h1>QR Generator</h1><div id="types"></div><div id="fields" class="fields"></div></section><aside class="qr-panel"><div id="qrcode" class="qr-box">Enter something to generate a QR code</div><div id="error" class="error hidden"></div><div class="actions"><button id="paste" class="action secondary">Paste QR</button><button id="open" class="action secondary">Open image</button><button id="png" class="action" disabled>Download PNG</button><button id="svg" class="action secondary" disabled>Download SVG</button></div><input id="imageInput" type="file" accept="image/*" hidden><div class="settings"><label for="level">Error correction</label><select id="level"><option>L</option><option selected>M</option><option>Q</option><option>H</option></select></div><p class="hint">Paste an image (Ctrl+V / Cmd+V), open a file, or drop an image onto the QR preview. QR generation and decoding happen in your browser.</p></aside></main>
<script>
'use strict';
const groups={'Basic':[['url','URL'],['text','Text'],['email','Email'],['phone','Phone'],['sms','SMS']],'Contacts & messaging':[['vcard','vCard'],['mecard','MECARD'],['whatsapp','WhatsApp'],['telegram','Telegram'],['facetime','FaceTime']],'Events & connectivity':[['calendar','Calendar event'],['geo','Geolocation'],['wifi','WiFi'],['app','App download'],['social','Social profile']],'Payments':[['bitcoin','Bitcoin'],['ethereum','Ethereum'],['paypal','PayPal'],['upi','UPI'],['sepa','SEPA / GiroCode']]};
const schemas={url:[['url','Website URL','url','https://example.com']],text:[['text','Text','textarea','Your text here']],email:[['email','Email address','email','hello@example.com'],['subject','Subject (optional)'],['body','Message (optional)','textarea']],phone:[['phone','Phone number','tel','+56912345678']],sms:[['phone','Phone number','tel'],['message','Message','textarea']],vcard:[['first','First name'],['last','Last name'],['org','Organization'],['title','Job title'],['phone','Mobile number','tel'],['workphone','Work number','tel'],['email','Email','email'],['url','Website','url'],['address','Street address'],['city','City'],['region','State / Region'],['postal','Postal code'],['country','Country'],['note','Notes','textarea']],mecard:[['name','Full name'],['phone','Phone','tel'],['email','Email','email'],['url','Website','url'],['address','Address']],whatsapp:[['phone','Phone number (international)'],['message','Prefilled message','textarea']],telegram:[['username','Public username']],facetime:[['contact','Phone number or Apple ID'],['video','Call type','select','',[['video','Video'],['audio','Audio']]]],calendar:[['title','Event title'],['start','Starts','datetime-local'],['end','Ends','datetime-local'],['location','Location'],['description','Description','textarea']],geo:[['lat','Latitude'],['lon','Longitude'],['maps','Map format','select','',[['google','Google Maps URL'],['geo','geo: URI']]]],wifi:[['ssid','Network name (SSID)'],['password','Password'],['security','Security','select','',[['WPA','WPA / WPA2 / WPA3'],['WEP','WEP'],['nopass','Open network']]],['hidden','Hidden network','checkbox']],app:[['platform','App store','select','',[['ios','Apple App Store'],['android','Google Play Store'],['custom','Custom URL']]],['id','App ID / package name / URL']],social:[['platform','Platform','select','',[['instagram','Instagram'],['linkedin','LinkedIn'],['tiktok','TikTok'],['youtube','YouTube'],['x','X'],['facebook','Facebook'],['custom','Other URL']]],['profile','Username or full profile URL']],bitcoin:[['address','Bitcoin address'],['amount','Amount in BTC'],['label','Label'],['message','Message']],ethereum:[['address','Recipient address (0x...)'],['chain','Chain ID (optional)','text','1'],['amount','Amount in ETH']],paypal:[['username','PayPal.Me username'],['amount','Amount'],['currency','Currency','select','',[['USD','USD'],['EUR','EUR'],['GBP','GBP'],['AUD','AUD'],['CAD','CAD']]]],upi:[['pa','UPI ID'],['pn','Payee name'],['am','Amount'],['cu','Currency','text','INR'],['tn','Transaction note']],sepa:[['name','Beneficiary name'],['iban','IBAN'],['bic','BIC'],['amount','Amount in EUR'],['reference','Payment reference'],['message','Remittance text']]};
let currentType='url',qrInstance=null,qrSvg='';const values={};const $=id=>document.getElementById(id);const enc=encodeURIComponent;const url=s=>!s?'':/^https?:\/\//i.test(s)?s:'https://'+s;const esc=s=>s.replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');const wifiEsc=s=>s.replace(/([\\;,:"])/g,'\\$1');const get=id=>String(values[currentType]?.[id]??'').trim();const validAmount=s=>{if(s&&!/^\d+(?:\.\d+)?$/.test(s))throw Error('Invalid amount');return s};const utc=s=>new Date(s).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
function renderTypes(){const root=$('types');root.replaceChildren();for(const [heading,types] of Object.entries(groups)){const h=document.createElement('h2');h.textContent=heading;root.append(h);const bar=document.createElement('div');bar.className='types';for(const [id,label] of types){const b=document.createElement('button');b.className='type-btn'+(id===currentType?' active':'');b.textContent=label;b.onclick=()=>{currentType=id;renderTypes();renderFields();generateQR()};bar.append(b)}root.append(bar)}}
function renderFields(){const root=$('fields');root.replaceChildren();for(const [id,label,type='text',placeholder='',options] of schemas[currentType]){const field=document.createElement('div');field.className='field'+(type==='checkbox'?' check':'');const lab=document.createElement('label');lab.textContent=label;lab.htmlFor='field-'+id;let input;if(type==='textarea')input=document.createElement('textarea');else if(type==='select'){input=document.createElement('select');for(const [v,t] of options){const o=document.createElement('option');o.value=v;o.textContent=t;input.append(o)}}else{input=document.createElement('input');input.type=type}input.id='field-'+id;input.placeholder=placeholder;if(type==='checkbox')input.checked=!!values[currentType]?.[id];else if(values[currentType]?.[id]!==undefined)input.value=values[currentType][id];if(type==='checkbox')field.append(input,lab);else field.append(lab,input);input.addEventListener('input',()=>{(values[currentType]??={})[id]=type==='checkbox'?input.checked:input.value;generateQR()});root.append(field)}}
function payload(){switch(currentType){
case 'url':return url(get('url'));case 'text':return get('text');
case 'email':{if(!get('email'))return '';const q=new URLSearchParams();if(get('subject'))q.set('subject',get('subject'));if(get('body'))q.set('body',get('body'));return 'mailto:'+get('email')+(q.size?'?'+q:'')}
case 'phone':return get('phone')?'tel:'+get('phone'):'';case 'sms':return get('phone')?'sms:'+get('phone')+(get('message')?'?body='+enc(get('message')):''):'';
case 'vcard':{if(!get('first')&&!get('last')&&!get('org'))return '';const a=['BEGIN:VCARD','VERSION:3.0','N:'+esc(get('last'))+';'+esc(get('first'))+';;;','FN:'+esc([get('first'),get('last')].filter(Boolean).join(' ')||get('org'))];for(const [key,label] of [['org','ORG'],['title','TITLE'],['phone','TEL;TYPE=CELL'],['workphone','TEL;TYPE=WORK'],['email','EMAIL'],['url','URL'],['note','NOTE']])if(get(key))a.push(label+':'+esc(get(key)));if(['address','city','region','postal','country'].some(get))a.push('ADR;TYPE=WORK:;;'+['address','city','region','postal','country'].map(k=>esc(get(k))).join(';'));return [...a,'END:VCARD'].join('\r\n')}
case 'mecard':{if(!get('name'))return '';const a=['MECARD:N:'+wifiEsc(get('name'))];for(const [key,label] of [['phone','TEL'],['email','EMAIL'],['url','URL'],['address','ADR']])if(get(key))a.push(label+':'+wifiEsc(get(key)));return a.join(';')+';;'}
case 'whatsapp':{const p=get('phone').replace(/\D/g,'');return p?'https://wa.me/'+p+(get('message')?'?text='+enc(get('message')):''):''}
case 'telegram':return get('username')?'https://t.me/'+enc(get('username').replace(/^@/,'')):'';
case 'facetime':return get('contact')?(get('video')==='audio'?'facetime-audio:':'facetime:')+get('contact'):'';
case 'calendar':{if(!get('title')||!get('start')||!get('end'))return '';if(new Date(get('end'))<=new Date(get('start')))throw Error('End must be after start');const a=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//QR Generator//EN','BEGIN:VEVENT','UID:'+crypto.randomUUID()+'@qr.local','DTSTAMP:'+utc(new Date().toISOString()),'DTSTART:'+utc(get('start')),'DTEND:'+utc(get('end')),'SUMMARY:'+esc(get('title'))];if(get('location'))a.push('LOCATION:'+esc(get('location')));if(get('description'))a.push('DESCRIPTION:'+esc(get('description')));return [...a,'END:VEVENT','END:VCALENDAR'].join('\r\n')}
case 'geo':{if(!get('lat')||!get('lon'))return '';const lat=Number(get('lat')),lon=Number(get('lon'));if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)throw Error('Invalid coordinates');return get('maps')==='geo'?`geo:${lat},${lon}`:`https://www.google.com/maps/search/?api=1&query=${lat}%2C${lon}`}
case 'wifi':return get('ssid')?`WIFI:T:${get('security')||'WPA'};S:${wifiEsc(get('ssid'))};P:${get('security')==='nopass'?'':wifiEsc(get('password'))};H:${values.wifi?.hidden?'true':'false'};;`:'';
case 'app':{const id=get('id');if(!id)return '';return get('platform')==='ios'?/^\d+$/.test(id)?'https://apps.apple.com/app/id'+id:url(id):get('platform')==='android'?'https://play.google.com/store/apps/details?id='+enc(id):url(id)}
case 'social':{const p=get('profile');if(!p)return '';if(/^https?:\/\//i.test(p))return p;const base={instagram:'https://instagram.com/',linkedin:'https://www.linkedin.com/in/',tiktok:'https://www.tiktok.com/@',youtube:'https://www.youtube.com/@',x:'https://x.com/',facebook:'https://www.facebook.com/'};return base[get('platform')]?base[get('platform')]+enc(p.replace(/^@/,'')):url(p)}
case 'bitcoin':{if(!get('address'))return '';const q=new URLSearchParams();for(const k of ['amount','label','message'])if(get(k))q.set(k,k==='amount'?validAmount(get(k)):get(k));return 'bitcoin:'+get('address')+(q.size?'?'+q:'')}
case 'ethereum':{if(!get('address'))return '';if(!/^0x[\da-f]{40}$/i.test(get('address')))throw Error('Invalid Ethereum address');let s='ethereum:'+get('address')+(get('chain')?'@'+get('chain'):'');if(get('amount')){validAmount(get('amount'));const [whole,frac='']=get('amount').split('.');if(frac.length>18)throw Error('Too many decimals');s+='?value='+(BigInt(whole)*10n**18n+BigInt((frac+'0'.repeat(18)).slice(0,18)))}return s}
case 'paypal':return get('username')?'https://paypal.me/'+enc(get('username'))+(get('amount')?'/'+validAmount(get('amount'))+(get('currency')||'USD'):''):'';
case 'upi':{if(!get('pa'))return '';const q=new URLSearchParams({pa:get('pa'),cu:get('cu')||'INR'});for(const k of ['pn','am','tn'])if(get(k))q.set(k,k==='am'?validAmount(get(k)):get(k));return 'upi://pay?'+q}
case 'sepa':{if(!get('name')||!get('iban'))return '';if(get('reference')&&get('message'))throw Error('Use reference or remittance, not both');return ['BCD','002','1','SCT',get('bic'),get('name'),get('iban').replace(/\s/g,''),get('amount')?'EUR'+validAmount(get('amount')):'','',get('reference'),get('message'),''].join('\n')}
}}
function clearQR(message='Enter something to generate a QR code'){qrInstance=null;qrSvg='';$('qrcode').textContent=message;$('png').disabled=$('svg').disabled=true}
function showError(e){$('error').textContent=e.message||String(e);$('error').classList.remove('hidden')}
function generateQR(){$('error').classList.add('hidden');try{const data=payload();if(!data){clearQR();return}if(typeof qrcode!=='function')throw Error('QR generator library failed to load');const qr=qrcode(0,$('level').value);qr.addData(data,'Byte');qr.make();const n=qr.getModuleCount(),scale=Math.max(4,Math.floor(1024/(n+8)));qrSvg=qr.createSvgTag(scale,4);qrInstance=qr;const img=new Image();img.alt='Generated QR';img.src='data:image/svg+xml;charset=utf-8,'+enc(qrSvg);$('qrcode').replaceChildren(img);$('png').disabled=$('svg').disabled=false}catch(e){clearQR('Unable to generate QR');showError(e)}}
function download(blob,name){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('svg').onclick=()=>qrSvg&&download(new Blob([qrSvg],{type:'image/svg+xml'}),'qr-code.svg');$('png').onclick=()=>{if(!qrInstance)return;const qr=qrInstance,n=qr.getModuleCount(),scale=Math.max(1,Math.floor(1024/(n+8))),canvas=document.createElement('canvas');canvas.width=canvas.height=(n+8)*scale;const ctx=canvas.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='black';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect((c+4)*scale,(r+4)*scale,scale,scale);canvas.toBlob(b=>b&&download(b,'qr-code.png'))};$('level').onchange=generateQR;
// QR clipboard/image import extension. Insert before the final renderTypes() call.
const importButton = document.createElement('button');
importButton.className = 'action secondary';
importButton.textContent = 'Paste QR';
importButton.type = 'button';
document.querySelector('.actions').prepend(importButton);
const uploadButton = document.createElement('button');
uploadButton.className = 'action secondary';
uploadButton.textContent = 'Open image';
uploadButton.type = 'button';
document.querySelector('.actions').append(uploadButton);
const imageInput = document.createElement('input');
imageInput.type = 'file'; imageInput.accept = 'image/*'; imageInput.hidden = true;
document.body.append(imageInput);
const decoderScript = document.createElement('script');
decoderScript.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
document.head.append(decoderScript);
function unescapeQR(s) {return (s||'').replace(/\\([nN\\;,])/g,(_,c)=>c==='n'||c==='N'?'\n':c)}
function parseQRData(raw) {
 const s=raw.trim(), result={}; let type='text';
 const match=(re)=>s.match(re);
 const query=(str)=>Object.fromEntries(new URLSearchParams(str));
 const web=(s)=>/^https?:\/\//i.test(s);
 try {
  if(/^BEGIN:VCARD/i.test(s)) {
   type='vcard'; const lines=s.replace(/\r?\n[ \t]/g,'').split(/\r?\n/);
   const entries={}; for(const line of lines){const i=line.indexOf(':');if(i<0)continue;const key=line.slice(0,i).toUpperCase(),val=unescapeQR(line.slice(i+1));(entries[key.split(';')[0]]??=[]).push([key,val])}
   const n=entries.N?.[0]?.[1]?.split(';')||[];result.first=n[1]||'';result.last=n[0]||'';
   if(!result.first&&!result.last)result.first=entries.FN?.[0]?.[1]||'';
   for(const [key,dest] of [['ORG','org'],['TITLE','title'],['EMAIL','email'],['URL','url'],['NOTE','note']])result[dest]=entries[key]?.[0]?.[1]||'';
   for(const [key,val] of entries.TEL||[])result[/WORK/.test(key)?'workphone':'phone']=val;
   const adr=(entries.ADR?.[0]?.[1]||'').split(';');Object.assign(result,{address:adr[2]||'',city:adr[3]||'',region:adr[4]||'',postal:adr[5]||'',country:adr[6]||''});
  } else if(/^MECARD:/i.test(s)) {
   type='mecard';for(const [,k,val] of s.matchAll(/(?:^|;)(N|TEL|EMAIL|URL|ADR):((?:\\.|[^;])*)/gi))result[({N:'name',TEL:'phone',EMAIL:'email',URL:'url',ADR:'address'})[k.toUpperCase()]]=unescapeQR(val);
  } else if(/^WIFI:/i.test(s)) {
   type='wifi';for(const [,k,val] of s.matchAll(/(?:^|;)([TSPH]):((?:\\.|[^;])*)/g)){const key={T:'security',S:'ssid',P:'password',H:'hidden'}[k];result[key]=k==='H'?val==='true':unescapeQR(val)}
  } else if(/^BEGIN:VCALENDAR/i.test(s)||/^BEGIN:VEVENT/i.test(s)) {
   type='calendar';const entries={};for(const line of s.replace(/\r?\n[ \t]/g,'').split(/\r?\n/)){const i=line.indexOf(':');if(i>0)entries[line.slice(0,i).split(';')[0]]=unescapeQR(line.slice(i+1))}
   const local=(str)=>{if(!str)return '';const m=str.match(/^(\d{4})(\d\d)(\d\d)T(\d\d)(\d\d)(\d\d)?(Z)?$/);if(!m)return '';if(m[7]){const d=new Date(`${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}:${m[6]||'00'}Z`);const pad=x=>String(x).padStart(2,'0');return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`}return `${m[1]}-${m[2]}-${m[3]}T${m[4]}:${m[5]}`};
   Object.assign(result,{title:entries.SUMMARY||'',start:local(entries.DTSTART),end:local(entries.DTEND),location:entries.LOCATION||'',description:entries.DESCRIPTION||''});
  } else if(/^mailto:/i.test(s)){type='email';const [addr,qs='']=s.slice(7).split('?');Object.assign(result,{email:decodeURIComponent(addr),subject:query(qs).subject||'',body:query(qs).body||''})}
  else if(/^tel:/i.test(s)){type='phone';result.phone=s.slice(4)}
  else if(/^sms:/i.test(s)){type='sms';const [num,qs='']=s.slice(4).split('?');result.phone=num;result.message=query(qs).body||''}
  else if(/^facetime(-audio)?:/i.test(s)){type='facetime';result.video=/^facetime-audio:/i.test(s)?'audio':'video';result.contact=s.replace(/^facetime(?:-audio)?:/i,'')}
  else if(/^geo:/i.test(s)){const m=match(/^geo:([-\d.]+),([-\d.]+)/i);if(m){type='geo';Object.assign(result,{lat:m[1],lon:m[2],maps:'geo'})}}
  else if(/^bitcoin:/i.test(s)){type='bitcoin';const [addr,qs='']=s.slice(8).split('?');Object.assign(result,{address:addr,...query(qs)})}
  else if(/^ethereum:/i.test(s)){type='ethereum';const [path,qs='']=s.slice(9).split('?');const [address,chain]=path.split('@');result.address=address;result.chain=chain||'';const wei=query(qs).value;if(wei&&/^\d+$/.test(wei)){const w=BigInt(wei);result.amount=(w/10n**18n).toString()+'.'+(w%10n**18n).toString().padStart(18,'0');result.amount=result.amount.replace(/\.?0+$/,'')}}
  else if(/^upi:\/\/pay\?/i.test(s)){type='upi';Object.assign(result,query(s.split('?')[1]||''))}
  else if(/^BCD\n|^BCD\r\n/.test(s)){type='sepa';const l=s.split(/\r?\n/);Object.assign(result,{bic:l[4]||'',name:l[5]||'',iban:l[6]||'',amount:(l[7]||'').replace(/^EUR/,''),reference:l[9]||'',message:l[10]||''})}
  else if(web(s)){
   const u=new URL(s),host=u.hostname.toLowerCase().replace(/^www\./,'');const p=u.pathname.split('/').filter(Boolean);
   if(host==='wa.me'&&p[0]){type='whatsapp';result.phone=p[0];result.message=u.searchParams.get('text')||''}
   else if(host==='t.me'&&p[0]){type='telegram';result.username=p[0]}
   else if(host==='paypal.me'&&p[0]){type='paypal';result.username=p[0];const m=(p[1]||'').match(/^(\d+(?:\.\d+)?)([A-Z]{3})?$/);if(m){result.amount=m[1];result.currency=m[2]||'USD'}}
   else if(host==='google.com'&&u.pathname==='/maps/search/'){const coords=(u.searchParams.get('query')||'').split(',');if(coords.length===2){type='geo';result.lat=coords[0];result.lon=coords[1];result.maps='google'}}
   else if(host==='apps.apple.com'&&/\/id\d+/.test(u.pathname)){type='app';result.platform='ios';result.id=u.pathname.match(/\/id(\d+)/)[1]}
   else if(host==='play.google.com'&&u.pathname.includes('/store/apps/details')){type='app';result.platform='android';result.id=u.searchParams.get('id')||''}
   else {const socialHosts={ 'instagram.com':'instagram','linkedin.com':'linkedin','tiktok.com':'tiktok','youtube.com':'youtube','x.com':'x','twitter.com':'x','facebook.com':'facebook'};
    if(socialHosts[host]){type='social';result.platform=socialHosts[host];result.profile=s}
    else {type='url';result.url=s}}
  } else if(/^\w+:/.test(s)){type='text';result.text=raw}
  else {type='text';result.text=raw}
 } catch(e){type='text';return {type,fields:{text:raw}}}
 return {type,fields:result};
}
function importPayload(raw){const parsed=parseQRData(raw);currentType=parsed.type;values[currentType]={...parsed.fields};$('types').replaceChildren();renderTypes();renderFields();generateQR();}
async function decodeQRFile(file){if(!file||!file.type.startsWith('image/'))throw Error('Select an image containing a QR code.');
 const bitmap=await createImageBitmap(file);try{const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(bitmap,0,0);const pixels=ctx.getImageData(0,0,canvas.width,canvas.height);if(typeof jsQR!=='function')throw Error('QR decoder is not loaded. Check your connection.');const result=jsQR(pixels.data,canvas.width,canvas.height,{inversionAttempts:'attemptBoth'});if(!result)throw Error('No readable QR code found in this image.');importPayload(result.data)}finally{bitmap.close()}}
async function importClipboard(){try{if(!navigator.clipboard?.read)throw Error('Clipboard image reading requires HTTPS or localhost. Try Ctrl+V instead.');const items=await navigator.clipboard.read();for(const item of items){const type=item.types.find(t=>t.startsWith('image/'));if(type){await decodeQRFile(await item.getType(type));return}}throw Error('No image found in clipboard.')}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}}
importButton.addEventListener('click',importClipboard);
uploadButton.addEventListener('click',()=>imageInput.click());
imageInput.addEventListener('change',async()=>{try{await decodeQRFile(imageInput.files[0])}catch(e){$('error').textContent=e.message;$('error').classList.remove('hidden')}imageInput.value='' });
document.addEventListener('paste',async(e)=>{const target=e.target;if(target?.matches?.('input,textarea,[contenteditable]'))return;const item=[...e.clipboardData.items].find(i=>i.type.startsWith('image/'));if(item){e.preventDefault();try{await decodeQRFile(item.getAsFile())}catch(err){$('error').textContent=err.message;$('error').classList.remove('hidden')}}});
const dropZone=$('qrcode');dropZone.addEventListener('dragover',e=>{e.preventDefault();dropZone.style.outline='2px dashed #276af0'});dropZone.addEventListener('dragleave',()=>dropZone.style.outline='');dropZone.addEventListener('drop',async(e)=>{e.preventDefault();dropZone.style.outline='';try{await decodeQRFile(e.dataTransfer.files[0])}catch(err){$('error').textContent=err.message;$('error').classList.remove('hidden')}});
// Connect the import controls to the single-file interface.
importButton.remove();uploadButton.remove();imageInput.remove();
$('paste').addEventListener('click',importClipboard);$('open').addEventListener('click',()=>$('imageInput').click());
$('imageInput').addEventListener('change',async e=>{try{await decodeQRFile(e.target.files[0])}catch(err){showError(err)}e.target.value='' });
renderTypes();renderFields();generateQR();
</script></body></html>
