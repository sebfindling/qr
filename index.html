<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f7fa;color:#202733;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.container{width:min(100%,930px);display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:30px;padding:30px;background:white;border-radius:18px;box-shadow:0 8px 32px #152b4412}h1{font-size:25px;margin:0 0 8px}h2{font-size:13px;color:#687385;margin:18px 0 8px}.types{display:flex;flex-wrap:wrap;gap:7px}.type-btn{padding:7px 11px;border:1px solid #dce2eb;border-radius:20px;background:#fff;color:#303d50;cursor:pointer;font:inherit;font-size:12px}.type-btn:hover{border-color:#3478f6}.type-btn.active{background:#276af0;color:white;border-color:#276af0}.fields{display:grid;gap:11px;margin-top:20px}.field{display:grid;gap:5px}.field label{font-size:12px;font-weight:600;color:#4c586b}.field input,.field textarea,.field select{width:100%;border:1.5px solid #dce2eb;border-radius:8px;padding:10px;font:inherit;background:white;min-width:0}.field textarea{min-height:78px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{outline:0;border-color:#276af0}.field.check{display:flex;align-items:center;gap:8px}.field.check input{width:auto}.field.check label{font-weight:400}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.qr-panel{display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:24px;align-self:start}.qr-box{width:240px;min-height:240px;border:1px solid #e5e9ef;border-radius:12px;display:grid;place-items:center;padding:10px;background:white;color:#8c96a6;text-align:center;font-size:12px;overflow:hidden}.qr-box img{display:block;width:100%;height:auto;image-rendering:pixelated}.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}.action{padding:9px 13px;border:0;border-radius:7px;background:#17814c;color:white;cursor:pointer;font:inherit;font-size:12px}.action.secondary{background:#eaf1ff;color:#215ac1}.action:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:12px;color:#778292;text-align:center;line-height:1.5}.error{font-size:12px;color:#c12f39;text-align:center}.settings{width:100%;display:grid;gap:6px}.settings label{font-size:12px;color:#687385}.settings select{width:100%;padding:7px;border:1px solid #dce2eb;border-radius:7px;background:white}.hidden{display:none!important}@media(max-width:690px){body{padding:12px;display:block}.container{grid-template-columns:1fr;padding:20px;gap:22px}.qr-panel{position:static;grid-row:1}.qr-box{width:200px;min-height:200px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="container">
<section><h1>QR Generator</h1><div id="types"></div><div id="fields" class="fields"></div></section>
<aside class="qr-panel"><div id="qrcode" class="qr-box">Enter something to generate a QR code</div><div id="error" class="error hidden"></div><div class="actions"><button id="png" class="action" disabled>Download PNG</button><button id="svg" class="action secondary" disabled>Download SVG</button></div><div class="settings"><label for="level">Error correction</label><select id="level"><option value="L">Low (L)</option><option value="M" selected>Medium (M)</option><option value="Q">Quartile (Q)</option><option value="H">High (H)</option></select></div><p class="hint">QR codes are generated locally in your browser. Some formats depend on the scanner and installed apps.</p></aside>
</main>
<script>
'use strict';
const groups={
  'Basic':[['url','URL'],['text','Text'],['email','Email'],['phone','Phone'],['sms','SMS']],
  'Contacts & messaging':[['vcard','vCard'],['mecard','MECARD'],['whatsapp','WhatsApp'],['telegram','Telegram'],['facetime','FaceTime']],
  'Events & connectivity':[['calendar','Calendar event'],['geo','Geolocation'],['wifi','WiFi'],['app','App download'],['social','Social profile']],
  'Payments':[['bitcoin','Bitcoin'],['ethereum','Ethereum'],['paypal','PayPal'],['upi','UPI'],['sepa','SEPA / GiroCode']]
};
// Each definition: [field id, label, input type, placeholder, optional select options]
const schemas={
 url:[['url','Website URL','url','https://example.com']],
 text:[['text','Text','textarea','Your text here']],
 email:[['email','Email address','email','hello@example.com'],['subject','Subject (optional)','text',''],['body','Message (optional)','textarea','']],
 phone:[['phone','Phone number','tel','+56912345678']],
 sms:[['phone','Phone number','tel','+56912345678'],['message','Message (optional)','textarea','']],
 vcard:[['first','First name','text','Jane'],['last','Last name','text','Doe'],['org','Organization','text','Example Ltd'],['title','Job title','text','Designer'],['phone','Mobile number','tel','+56912345678'],['workphone','Work number','tel',''],['email','Email','email',''],['url','Website','url',''],['address','Street address','text',''],['city','City','text',''],['region','State / Region','text',''],['postal','Postal code','text',''],['country','Country','text',''],['note','Notes','textarea','']],
 mecard:[['name','Full name','text','Jane Doe'],['phone','Phone','tel',''],['email','Email','email',''],['url','Website','url',''],['address','Address','text','']],
 whatsapp:[['phone','Phone number (international, digits only)','tel','56912345678'],['message','Prefilled message (optional)','textarea','']],
 telegram:[['username','Public username (without @)','text','example']],
 facetime:[['contact','Phone number or Apple ID email','text','+56912345678'],['video','Call type','select','',[['video','Video'],['audio','Audio']]]],
 calendar:[['title','Event title','text','Team meeting'],['start','Starts','datetime-local',''],['end','Ends','datetime-local',''],['location','Location (optional)','text',''],['description','Description (optional)','textarea','']],
 geo:[['lat','Latitude','text','-33.4489'],['lon','Longitude','text','-70.6693'],['maps','Map format','select','',[['google','Google Maps URL (recommended)'],['geo','geo: URI']]]],
 wifi:[['ssid','Network name (SSID)','text','My WiFi'],['password','Password','text',''],['security','Security','select','',[['WPA','WPA / WPA2 / WPA3 Personal'],['WEP','WEP'],['nopass','Open network']]],['hidden','Hidden network','checkbox','']],
 app:[['platform','App store','select','',[['ios','Apple App Store'],['android','Google Play Store'],['custom','Custom app URL']]],['id','App ID / package name / URL','text','com.example.app']],
 social:[['platform','Platform','select','',[['instagram','Instagram'],['linkedin','LinkedIn'],['tiktok','TikTok'],['youtube','YouTube'],['x','X'],['facebook','Facebook'],['custom','Other (full URL)']]],['profile','Username or full profile URL','text','example']],
 bitcoin:[['address','Bitcoin address','text',''],['amount','Amount in BTC (optional)','text',''],['label','Label (optional)','text',''],['message','Message (optional)','text','']],
 ethereum:[['address','Recipient address (0x...)','text',''],['chain','Chain ID (optional)','text','1'],['amount','Amount in ETH (optional)','text','']],
 paypal:[['username','PayPal.Me username','text','example'],['amount','Amount (optional)','text',''],['currency','Currency','select','',[['USD','USD'],['EUR','EUR'],['GBP','GBP'],['AUD','AUD'],['CAD','CAD']]]],
 upi:[['pa','UPI ID','text','name@bank'],['pn','Payee name','text',''],['am','Amount (optional)','text',''],['cu','Currency','text','INR'],['tn','Transaction note','text','']],
 sepa:[['name','Beneficiary name','text',''],['iban','IBAN','text',''],['bic','BIC (optional)','text',''],['amount','Amount in EUR (optional)','text',''],['reference','Payment reference (optional)','text',''],['message','Remittance text (optional)','text','']]
};
let currentType='url', qrInstance=null, qrSvg='';
const $=id=>document.getElementById(id);
const values={};
function makeElement(tag,attrs={},value=''){const el=document.createElement(tag);for(const [k,v] of Object.entries(attrs)){if(k==='className')el.className=v;else el.setAttribute(k,v)}if(value)el.textContent=value;return el}
function renderTypes(){const root=$('types');for(const [heading,types] of Object.entries(groups)){root.append(makeElement('h2',{},heading));const bar=makeElement('div',{className:'types'});for(const [id,label] of types){const btn=makeElement('button',{type:'button',className:'type-btn'+(id===currentType?' active':''),'data-type':id},label);btn.addEventListener('click',()=>{currentType=id;renderTypes();renderFields();generateQR()});bar.append(btn)}root.append(bar)}}
function renderFields(){const root=$('fields');root.replaceChildren();for(const [id,label,type,placeholder,options] of schemas[currentType]){const field=makeElement('div',{className:'field'+(type==='checkbox'?' check':'')});const lab=makeElement('label',{for:'field-'+id},label);let input;if(type==='textarea')input=makeElement('textarea',{id:'field-'+id,placeholder});else if(type==='select'){input=makeElement('select',{id:'field-'+id});for(const [v,t] of options)input.append(makeElement('option',{value:v},t))}else input=makeElement('input',{id:'field-'+id,type,placeholder});if(type==='checkbox'){input.checked=Boolean(values[currentType]?.[id]);field.append(input,lab)}else{if(values[currentType]?.[id]!==undefined)input.value=values[currentType][id];field.append(lab,input)}input.addEventListener('input',()=>{(values[currentType]??={})[id]=type==='checkbox'?input.checked:input.value;generateQR()});root.append(field)}const first=root.querySelector('input:not([type=checkbox]),textarea');if(first)first.focus()}
function v(id){return String(values[currentType]?.[id]??'').trim()}
function enc(s){return encodeURIComponent(s)}
function url(s){if(!s)return '';return /^https?:\/\//i.test(s)?s:'https://'+s}
function escapeV(s){return s.replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,')}
function escapeWifi(s){return s.replace(/([\\;,:"\\])/g,'\\$1')}
function escapeMecard(s){return s.replace(/([\\;,:])/g,'\\$1')}
function utcDate(s){if(!s)return '';const d=new Date(s);if(!Number.isFinite(d.getTime()))throw Error('Invalid date');return d.toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'')}
function amount(s){if(!s)return '';if(!/^\d+(?:\.\d+)?$/.test(s)||Number(s)<=0)throw Error('Enter a valid positive amount');return s}
function payload(){switch(currentType){
 case 'url':return url(v('url'));
 case 'text':return v('text');
 case 'email':{if(!v('email'))return '';const p=new URLSearchParams();if(v('subject'))p.set('subject',v('subject'));if(v('body'))p.set('body',v('body'));return 'mailto:'+v('email')+(p.size?'?'+p:'')}
 case 'phone':return v('phone')?'tel:'+v('phone'):'';
 case 'sms':return v('phone')?'sms:'+v('phone')+(v('message')?'?body='+enc(v('message')):''):'';
 case 'vcard':{if(!v('first')&&!v('last')&&!v('org'))return '';const a=['BEGIN:VCARD','VERSION:3.0','N:'+escapeV(v('last'))+';'+escapeV(v('first'))+';;;','FN:'+escapeV([v('first'),v('last')].filter(Boolean).join(' ')||v('org'))];const entries=[['org','ORG'],['title','TITLE'],['phone','TEL;TYPE=CELL'],['workphone','TEL;TYPE=WORK'],['email','EMAIL'],['url','URL'],['note','NOTE']];for(const [key,label] of entries)if(v(key))a.push(label+':'+escapeV(v(key)));if(['address','city','region','postal','country'].some(v))a.push('ADR;TYPE=WORK:;;'+[v('address'),v('city'),v('region'),v('postal'),v('country')].map(escapeV).join(';'));return [...a,'END:VCARD'].join('\r\n')}
 case 'mecard':{if(!v('name'))return '';const a=['MECARD:N:'+escapeMecard(v('name'))];for(const [key,label] of [['phone','TEL'],['email','EMAIL'],['url','URL'],['address','ADR']])if(v(key))a.push(label+':'+escapeMecard(v(key)));return a.join(';')+';;'}
 case 'whatsapp':{const p=v('phone').replace(/[^\d]/g,'');return p?'https://wa.me/'+p+(v('message')?'?text='+enc(v('message')):''):''}
 case 'telegram':return v('username')?'https://t.me/'+enc(v('username').replace(/^@/,'')):'';
 case 'facetime':return v('contact')?(v('video')==='audio'?'facetime-audio:':'facetime:')+v('contact'):'';
 case 'calendar':{if(!v('title')||!v('start')||!v('end'))return '';if(new Date(v('end'))<=new Date(v('start')))throw Error('End must be after start');const now=utcDate(new Date().toISOString());const a=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//QR Generator//EN','BEGIN:VEVENT','UID:'+crypto.randomUUID()+'@qr.local','DTSTAMP:'+now,'DTSTART:'+utcDate(v('start')),'DTEND:'+utcDate(v('end')),'SUMMARY:'+escapeV(v('title'))];if(v('location'))a.push('LOCATION:'+escapeV(v('location')));if(v('description'))a.push('DESCRIPTION:'+escapeV(v('description')));return [...a,'END:VEVENT','END:VCALENDAR'].join('\r\n')}
 case 'geo':{if(!v('lat')||!v('lon'))return '';const lat=Number(v('lat')),lon=Number(v('lon'));if(!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180)throw Error('Invalid coordinates');return v('maps')==='geo'?`geo:${lat},${lon}`:`https://www.google.com/maps/search/?api=1&query=${lat}%2C${lon}`}
 case 'wifi':return v('ssid')?`WIFI:T:${v('security')||'WPA'};S:${escapeWifi(v('ssid'))};P:${v('security')==='nopass'?'':escapeWifi(v('password'))};H:${values.wifi?.hidden?'true':'false'};;`:'';
 case 'app':{const id=v('id');if(!id)return '';switch(v('platform')){case 'ios':return /^\d+$/.test(id)?'https://apps.apple.com/app/id'+id: url(id);case 'android':return 'https://play.google.com/store/apps/details?id='+enc(id);default:return url(id)}}
 case 'social':{const p=v('profile');if(!p)return '';if(/^https?:\/\//i.test(p))return p;const x=p.replace(/^@/,'');const base={instagram:'https://instagram.com/',linkedin:'https://www.linkedin.com/in/',tiktok:'https://www.tiktok.com/@',youtube:'https://www.youtube.com/@',x:'https://x.com/',facebook:'https://www.facebook.com/'};return base[v('platform')]?base[v('platform')]+enc(x):url(p)}
 case 'bitcoin':{if(!v('address'))return '';const q=new URLSearchParams();if(v('amount'))q.set('amount',amount(v('amount')));if(v('label'))q.set('label',v('label'));if(v('message'))q.set('message',v('message'));return 'bitcoin:'+v('address')+(q.size?'?'+q:'')}
 case 'ethereum':{if(!v('address'))return '';if(!/^0x[0-9a-fA-F]{40}$/.test(v('address')))throw Error('Enter a valid Ethereum address');const chain=v('chain');if(chain&&!/^\d+$/.test(chain))throw Error('Invalid chain ID');let out='ethereum:'+v('address')+(chain?'@'+chain:'');if(v('amount')){const a=amount(v('amount'));const [whole,frac='']=a.split('.');if(frac.length>18)throw Error('ETH supports at most 18 decimals');const wei=BigInt(whole)*10n**18n+BigInt((frac+'0'.repeat(18)).slice(0,18));out+='?value='+wei.toString()}return out}
 case 'paypal':return v('username')?'https://paypal.me/'+enc(v('username'))+(v('amount')?'/'+amount(v('amount'))+(v('currency')||'USD'):''):'';
 case 'upi':{if(!v('pa'))return '';const q=new URLSearchParams({pa:v('pa'),cu:v('cu')||'INR'});if(v('pn'))q.set('pn',v('pn'));if(v('am'))q.set('am',amount(v('am')));if(v('tn'))q.set('tn',v('tn'));return 'upi://pay?'+q}
 case 'sepa':{if(!v('name')||!v('iban'))return '';const amt=v('amount')?'EUR'+amount(v('amount')):'';if(v('reference')&&v('message'))throw Error('Use either reference or remittance text, not both');const lines=['BCD','002','1','SCT',v('bic'),v('name'),v('iban').replace(/\s/g,''),amt,'',v('reference'),v('message'),''];return lines.join('\n')}
 default:return '';
}}
function clearQR(msg='Enter something to generate a QR code'){qrInstance=null;qrSvg='';$('qrcode').textContent=msg;$('png').disabled=true;$('svg').disabled=true}
function generateQR(){const err=$('error');err.classList.add('hidden');err.textContent='';try{const data=payload();if(!data){clearQR();return}if(typeof qrcode!=='function')throw Error('QR library failed to load. Check your connection.');const qr=qrcode(0,$('level').value);qr.addData(data,'Byte');qr.make();const size=qr.getModuleCount(),margin=4,scale=Math.max(4,Math.floor(1024/(size+margin*2)));qrSvg=qr.createSvgTag(scale,margin);qrInstance=qr;const img=new Image();img.alt='Generated QR code';img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(qrSvg);$('qrcode').replaceChildren(img);$('png').disabled=false;$('svg').disabled=false}catch(e){clearQR('Unable to generate QR');err.textContent=e.message||String(e);err.classList.remove('hidden')}}
function download(blob,filename){const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('svg').addEventListener('click',()=>{if(qrSvg)download(new Blob([qrSvg],{type:'image/svg+xml'}),'qr-code.svg')});
$('png').addEventListener('click',()=>{if(!qrInstance)return;const qr=qrInstance,n=qr.getModuleCount(),margin=4,scale=Math.max(1,Math.floor(1024/(n+margin*2))),size=(n+margin*2)*scale;const canvas=document.createElement('canvas');canvas.width=canvas.height=size;const ctx=canvas.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);ctx.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(qr.isDark(r,c))ctx.fillRect((c+margin)*scale,(r+margin)*scale,scale,scale);canvas.toBlob(blob=>{if(blob)download(blob,'qr-code.png')},'image/png')});
$('level').addEventListener('change',generateQR);
renderTypes();renderFields();generateQR();
</script>
</body></html>
